# Docker Compose configuration for Cumberland Farms DSD Reconciliation MVP
# Base configuration using SQLite for local/preview deployment

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - APP_ENV=pilot_local
      - FIXTURE_ROOT=./fixtures
      - TRIAGE_MODE=MOCK
      - AUTH_STUB_ENABLED=true
      - DEFAULT_BATCH_SOURCE=pilot_batch_01
      - SECRET_KEY=pilot-dev-secret-key-change-in-production
    ports:
      - "8000:8000"
    volumes:
      - data:/data
    x-preview-port: 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    x-preview-port: 80

volumes:
  data:
